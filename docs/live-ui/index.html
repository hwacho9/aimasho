<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Aimasho Live UI</title>
  <style>
    :root {
      --ink: #302725;
      --muted: #665c57;
      --paper: #fffaf4;
      --surface: #fffefb;
      --peach: #ffd8c4;
      --coral: #ec654b;
      --coral-dark: #cf4c35;
      --line: #dfd1c7;
      --green: #348f5d;
      --yellow: #bd7b12;
      --red: #c95146;
      --doc-bg: #eee7e0;
      --panel: #f8f3ed;
      --shadow: 0 22px 60px rgba(65, 43, 34, .12);
      --preview-scale: 1;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--doc-bg); }
    body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Noto Sans JP", "Hiragino Sans", Arial, sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .docs-shell {
      min-height: 100vh;
      display: grid;
      grid-template: 72px 1fr / 264px minmax(0, 1fr) 292px;
      background: var(--doc-bg);
    }

    .docs-topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr) 292px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 250, 244, .94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .docs-brand { height: 100%; display: flex; align-items: center; gap: 11px; padding: 0 22px; border-right: 1px solid var(--line); }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: white; background: var(--coral); font-weight: 900; box-shadow: 0 4px 0 #bd4534; }
    .docs-brand div { display: flex; flex-direction: column; }
    .docs-brand b { font-size: 15px; letter-spacing: -.3px; }
    .docs-brand span { color: var(--muted); font-size: 12px; }

    .view-tabs { display: flex; align-items: center; gap: 4px; padding: 0 20px; overflow-x: auto; }
    .view-tab, .platform-tab, .icon-button {
      border: 0;
      background: transparent;
      border-radius: 11px;
      cursor: pointer;
      transition: .18s ease;
    }
    .view-tab { padding: 10px 14px; color: var(--muted); font-size: 14px; font-weight: 750; white-space: nowrap; }
    .view-tab:hover, .view-tab.active { color: var(--coral-dark); background: #fff0e9; }
    .top-actions { height: 100%; padding: 0 18px; border-left: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .search { width: 100%; height: 40px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: white; padding: 0 12px; }
    .search span { color: #8e817a; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }

    .screen-nav { grid-row: 2; position: sticky; top: 72px; height: calc(100vh - 72px); overflow-y: auto; padding: 22px 14px 36px; background: var(--paper); border-right: 1px solid var(--line); }
    .platform-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: #eee5de; border-radius: 12px; padding: 4px; margin: 0 4px 22px; }
    .platform-tab { padding: 8px 5px; font-size: 12px; font-weight: 800; color: var(--muted); }
    .platform-tab.active { color: var(--coral-dark); background: white; box-shadow: 0 2px 8px rgba(55, 38, 30, .08); }
    .nav-group { margin-top: 22px; }
    .nav-group-title { margin: 0 10px 8px; color: #9a8c84; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .screen-link { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 9px; align-items: center; padding: 9px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; }
    .screen-link:hover { background: #f7eee7; }
    .screen-link.active { background: #fff0e9; color: var(--coral-dark); }
    .screen-link .nav-icon { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid #eadfd6; border-radius: 9px; background: white; font-size: 12px; }
    .screen-link strong { display: block; font-size: 13px; }
    .screen-link small { display: block; margin-top: 1px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .screen-link em { color: #a3938b; font-size: 13px; font-style: normal; }

    .docs-main { grid-column: 2; grid-row: 2; min-width: 0; padding: 28px 30px 50px; }
    .workspace-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin: 0 auto 22px; max-width: 1480px; }
    .workspace-heading .eyebrow { margin: 0 0 6px; color: var(--coral); font-size: 12px; font-weight: 900; letter-spacing: .12em; }
    .workspace-heading h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); letter-spacing: -.04em; }
    .workspace-heading p { max-width: 720px; margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .workspace-controls { display: flex; gap: 7px; flex: none; }
    .icon-button { min-width: 40px; height: 40px; border: 1px solid var(--line); background: white; font-size: 14px; font-weight: 800; }
    .icon-button:hover { border-color: #f1a18b; color: var(--coral-dark); }

    .overview-grid { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .screen-card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 10px 30px rgba(61, 42, 34, .07); cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .screen-card:hover { transform: translateY(-4px); border-color: #f0a18d; box-shadow: 0 18px 42px rgba(61, 42, 34, .12); }
    .screen-card-preview { position: relative; height: 202px; overflow: hidden; background: #e4d9cf; border-bottom: 1px solid var(--line); }
    .screen-card-preview .device-screen { pointer-events: none; transform-origin: 0 0; }
    .screen-card-preview.web .device-screen { width: 1180px; height: 720px; left: 50%; transform: translateX(-50%) scale(.285); transform-origin: top center; }
    .screen-card-preview.mobile .device-screen { width: 390px; height: 844px; left: 50%; transform: translateX(-50%) scale(.225); transform-origin: top center; border: 12px solid var(--ink); border-radius: 42px; }
    .card-copy { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 15px 16px 17px; }
    .card-copy h2 { margin: 0; font-size: 16px; }
    .card-copy p { grid-column: 1; margin: 4px 0 0; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .route-pill { align-self: start; max-width: 115px; overflow: hidden; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); padding: 5px 8px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }

    .prototype-stage { max-width: 1480px; min-height: calc(100vh - 190px); margin: 0 auto; display: flex; align-items: flex-start; justify-content: center; overflow: auto; border: 1px solid #d4c8be; border-radius: 24px; background: #dcd2ca; background-image: radial-gradient(#c3b6ac 1px, transparent 1px); background-size: 22px 22px; padding: 42px; }
    .device-wrap { position: relative; flex: none; transition: width .25s ease, height .25s ease; }
    .device-screen { position: absolute; top: 0; left: 0; overflow: hidden; background: var(--paper); color: var(--ink); transform: scale(var(--preview-scale)); transform-origin: top left; box-shadow: var(--shadow); transition: opacity .18s ease, transform .22s ease; }
    .device-screen.switching { opacity: 0; transform: scale(calc(var(--preview-scale) * .98)) translateY(12px); }
    .device-screen.web { width: 1180px; height: 720px; border: 1px solid #d5c9c0; border-radius: 20px; }
    .device-screen.mobile { width: 390px; height: 844px; border: 10px solid var(--ink); border-radius: 46px; }

    .inspector { grid-column: 3; grid-row: 2; position: sticky; top: 72px; height: calc(100vh - 72px); overflow-y: auto; padding: 22px 20px 36px; background: var(--paper); border-left: 1px solid var(--line); }
    .inspect-section { padding: 0 0 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
    .inspect-section:last-child { border-bottom: 0; }
    .inspect-label { margin: 0 0 10px; color: #9a8b83; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .inspect-section h2 { margin: 0 0 5px; font-size: 19px; }
    .inspect-section p { margin: 7px 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .inspect-route { display: inline-block; max-width: 100%; overflow: hidden; border-radius: 8px; background: #eee5de; padding: 7px 9px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .transition-list, .source-list { display: flex; flex-direction: column; gap: 7px; }
    .transition-link { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 11px; background: white; text-align: left; cursor: pointer; }
    .transition-link:hover { border-color: #ef9a83; color: var(--coral-dark); }
    .transition-link strong { font-size: 12px; }
    .transition-link small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .source-list code { display: block; overflow-wrap: anywhere; border-radius: 9px; background: #eee5de; padding: 9px; color: #544844; font-size: 11px; line-height: 1.5; }
    .key-hints { display: flex; flex-wrap: wrap; gap: 6px; }
    .key-hints span { border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 7px; background: white; padding: 5px 7px; color: var(--muted); font-size: 11px; }

    .flow-board { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
    .flow-lane { border: 1px solid var(--line); border-radius: 22px; background: rgba(255, 254, 251, .82); padding: 22px; }
    .flow-lane-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .flow-lane-heading h2 { margin: 0; font-size: 18px; }
    .flow-lane-heading span { color: var(--muted); font-size: 13px; }
    .flow-track { display: flex; align-items: stretch; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .flow-node { width: 170px; flex: none; padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: white; text-align: left; cursor: pointer; }
    .flow-node:hover { border-color: #ef9a83; }
    .flow-node small { color: var(--coral); font-size: 11px; font-weight: 900; }
    .flow-node b { display: block; margin: 7px 0 3px; font-size: 14px; }
    .flow-node span { display: block; overflow: hidden; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .flow-arrow { display: grid; place-items: center; flex: none; color: #9b8d85; font-size: 20px; }
    .branch-note { margin: 14px 0 0; color: var(--muted); font-size: 13px; }

    .tokens-board { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .token-panel { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); padding: 22px; }
    .token-panel h2 { margin: 0 0 18px; font-size: 19px; }
    .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
    .color-token { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .color-token i { display: block; height: 74px; }
    .color-token div { padding: 10px; }
    .color-token b, .color-token small { display: block; }
    .color-token b { font-size: 13px; }
    .color-token small { margin-top: 3px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .type-sample { padding: 15px 0; border-top: 1px solid var(--line); }
    .type-sample:first-of-type { border-top: 0; }
    .type-sample small { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .type-display { font-size: 38px; font-weight: 900; letter-spacing: -.05em; line-height: 1.15; }
    .type-heading { font-size: 26px; font-weight: 850; letter-spacing: -.035em; }
    .type-body { font-size: 16px; line-height: 1.7; }
    .component-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }

    .empty-state { max-width: 640px; margin: 90px auto; text-align: center; }
    .empty-state span { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px; background: #fff0e9; color: var(--coral); font-size: 28px; }
    .empty-state h2 { margin: 0; }
    .empty-state p { color: var(--muted); }

    /* Shared product preview UI */
    .app-browser { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #e9dfd7; border-bottom: 1px solid #d9cdc4; color: #897b74; font-size: 8px; }
    .app-browser i { width: 7px; height: 7px; border-radius: 50%; background: #c3b4aa; }
    .app-browser i:first-child { background: #ed7b67; }
    .app-browser span { margin-left: 8px; border-radius: 5px; background: #f7f0ea; padding: 3px 70px; }
    .app-nav { height: 62px; display: flex; justify-content: space-between; align-items: center; padding: 0 52px; border-bottom: 1px solid #eadfd6; background: rgba(255, 250, 244, .96); }
    .app-logo { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 900; }
    .app-logo i { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; background: var(--coral); color: white; font-style: normal; }
    .app-nav-links { display: flex; align-items: center; gap: 18px; }
    .app-nav-links button { border: 0; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
    .app-nav-links .nav-cta { border: 1px solid var(--line); border-radius: 11px; background: white; padding: 9px 12px; color: var(--coral-dark); font-weight: 850; }
    .preview-page { height: 630px; overflow: hidden; padding: 40px 62px; }
    .preview-page.centered { display: grid; place-items: center; }
    .preview-eyebrow { margin: 0; color: var(--coral); font-size: 10px; font-weight: 900; letter-spacing: .12em; }
    .preview-title { margin: 7px 0 8px; font-size: 30px; line-height: 1.2; letter-spacing: -.04em; }
    .preview-copy { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .app-primary, .app-secondary, .app-text-button { border: 0; cursor: pointer; font-weight: 850; }
    .app-primary { border-radius: 14px; background: var(--coral); color: white; padding: 13px 18px; box-shadow: 0 5px 0 #bd4534; }
    .app-secondary { border: 1px solid var(--line); border-radius: 14px; background: white; color: var(--coral-dark); padding: 12px 17px; }
    .app-text-button { background: transparent; color: var(--coral); padding: 8px; }
    .preview-card { border: 1px solid var(--line); border-radius: 19px; background: var(--surface); box-shadow: 0 14px 35px rgba(75, 46, 35, .06); }
    .preview-field { margin-top: 13px; }
    .preview-field span { display: block; margin-bottom: 6px; font-size: 10px; font-weight: 850; }
    .preview-field div { height: 43px; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: white; padding: 0 12px; color: #958880; font-size: 10px; }
    .app-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 99px; background: white; padding: 7px 10px; color: var(--muted); font-size: 9px; font-weight: 800; }
    .app-chip.active { border-color: #f0b29f; background: #fff0e9; color: var(--coral-dark); }
    .app-chip.green { border-color: #b7dec7; background: #edf8f1; color: var(--green); }
    .status-pill { border-radius: 99px; background: #fff0e9; padding: 6px 9px; color: var(--coral-dark); font-size: 8px; font-weight: 900; }
    .avatar-stack { display: flex; align-items: center; }
    .avatar-stack i { width: 29px; height: 29px; display: grid; place-items: center; margin-left: -6px; border: 3px solid var(--surface); border-radius: 50%; background: var(--peach); font-size: 8px; font-style: normal; font-weight: 900; }

    .guest-layout { height: 100%; display: grid; grid-template-columns: 1fr .9fr; gap: 58px; align-items: center; }
    .guest-copy h1 { margin: 12px 0 18px; font-size: 50px; line-height: 1.08; letter-spacing: -.06em; }
    .guest-copy h1 strong { color: var(--coral); }
    .guest-copy > p:not(.preview-eyebrow) { color: var(--muted); font-size: 14px; line-height: 1.75; }
    .guest-copy .app-primary { margin-top: 14px; }
    .guest-copy small { display: block; margin-top: 15px; color: #8c7e77; font-size: 9px; }
    .plan-preview { padding: 24px; box-shadow: 8px 8px 0 #f1e4da; }
    .plan-preview h2 { margin: 12px 0 15px; font-size: 24px; }
    .plan-step { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #eee3db; }
    .plan-step > i { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: #fff0e9; color: var(--coral); font-style: normal; font-weight: 900; }
    .plan-step b, .plan-step small { display: block; }
    .plan-step b { font-size: 12px; }
    .plan-step small { margin-top: 2px; color: var(--muted); font-size: 8px; }

    .auth-card { width: 420px; padding: 32px; text-align: center; }
    .auth-card .app-logo { justify-content: center; margin-bottom: 22px; }
    .auth-card h1 { margin: 0 0 7px; font-size: 26px; }
    .auth-card > p { margin: 0 0 22px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .auth-card .app-primary, .auth-card .app-secondary { width: 100%; margin-top: 10px; }
    .auth-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; color: #a1938b; font-size: 9px; }
    .auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }

    .dash-head, .page-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; margin: 18px 0 13px; }
    .summary-item { height: 78px; display: grid; grid-template-columns: 38px 1fr; grid-template-rows: 1fr 1fr; align-items: center; border-radius: 17px; padding: 13px; }
    .summary-item i { grid-row: 1 / 3; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: rgba(255, 255, 255, .55); font-style: normal; }
    .summary-item b { align-self: end; font-size: 18px; }
    .summary-item span { align-self: start; color: var(--muted); font-size: 8px; }
    .tone-coral { background: #fff0e9; }.tone-green { background: #edf8f1; }.tone-yellow { background: #fff6dc; }.tone-rose { background: #faecef; }
    .journey-banner { height: 66px; display: flex; align-items: center; gap: 12px; border-radius: 17px; background: var(--ink); padding: 11px 16px; color: white; cursor: pointer; }
    .journey-banner > i { color: #ff9a82; font-size: 22px; font-style: normal; }
    .journey-banner div { display: flex; flex-direction: column; flex: 1; }
    .journey-banner small { color: #ff9a82; font-size: 7px; font-weight: 900; letter-spacing: .12em; }
    .journey-banner b { font-size: 12px; }
    .journey-banner span { color: #cdbfba; font-size: 8px; }
    .next-card { height: 74px; display: flex; align-items: center; gap: 12px; margin: 12px 0; padding: 12px 15px; border-color: #f0b6a4; cursor: pointer; }
    .next-card > i { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: #fff0e9; color: var(--coral); font-style: normal; }
    .next-card div { display: flex; flex-direction: column; flex: 1; }
    .next-card small { color: var(--coral); font-size: 7px; }.next-card b { font-size: 12px; }.next-card span { color: var(--muted); font-size: 8px; }
    .calendar-card { padding: 16px; }
    .calendar-title { display: flex; justify-content: space-between; align-items: center; }
    .calendar-title h2 { margin: 0; font-size: 15px; }
    .calendar-title span { border-radius: 9px; background: #f1e7df; padding: 7px 10px; color: var(--coral-dark); font-size: 8px; font-weight: 850; }
    .calendar-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 12px; }
    .calendar-week b { padding: 5px; color: #897b74; font-size: 7px; text-align: center; }
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .calendar-days i { min-height: 28px; border-radius: 6px; padding: 3px; font-size: 7px; font-style: normal; }
    .calendar-days .today { background: #fff0e9; color: var(--coral); font-weight: 900; }
    .calendar-days .event { background: #fff7f3; }
    .calendar-days .event::after { content: "약속"; display: block; margin-top: 2px; border-radius: 3px; background: var(--coral); padding: 2px; color: white; font-size: 5px; }

    .form-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; }
    .form-card, .guide-card, .join-card, .profile-main, .profile-side, .room-main, .room-side { padding: 22px; }
    .form-card h2, .guide-card h2, .join-card h2 { margin: 4px 0 8px; font-size: 20px; }
    .slot-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .slot-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 13px; background: white; padding: 10px; }
    .slot-row i { color: var(--coral); font-size: 8px; font-style: normal; font-weight: 900; }
    .slot-row b, .slot-row small { display: block; }.slot-row b { font-size: 10px; }.slot-row small { color: var(--muted); font-size: 8px; }
    .slot-row span:last-child { color: #9b8e87; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 17px; }
    .guide-card { background: #302725; color: white; }

    function screenMarkup(screen) {
      if (screen.type === 'guest') return guestMarkup(screen);
      if (screen.type === 'login') return loginMarkup(screen);
      if (screen.type === 'dashboard') return dashboardMarkup(screen);
      if (screen.type === 'create') return createMarkup(screen);
      if (screen.type === 'join') return joinMarkup(screen);
      if (screen.type === 'room-join') return joinMarkup(screen, true);
      if (screen.type === 'plan') return planMarkup(screen);
      if (screen.type === 'room') return roomMarkup(screen);
      if (screen.type === 'profile') return profileMarkup(screen);
      if (screen.type === 'friend') return profileMarkup(screen, true);
      if (screen.type === 'journey') return journeyMarkup(screen);

    function renderNav() {
      const groups = [...new Set(screens.map(s => `${s.platform}:${s.group}`))];
      navGroups.innerHTML = groups.map(key => {
        const [platform, group] = key.split(':');
        if (state.platform !== 'all' && state.platform !== platform) return '';
        const items = screens.filter(s => s.platform === platform && s.group === group);
        return `<section class="nav-group"><p class="nav-group-title">${platform.toUpperCase()} · ${group}</p>${items.map(s => `<button class="screen-link ${s.id === state.currentId ? 'active' : ''}" data-open="${s.id}"><span class="nav-icon">${s.icon}</span><span><strong>${s.title}</strong><small>${s.route}</small></span><em>›</em></button>`).join('')}</section>`;
      }).join('');
    }

    function renderOverview() {
      const list = visibleScreens();
      if (!list.length) return `<div class="empty-state"><span>⌕</span><h2>검색 결과가 없어요</h2><p>화면 이름이나 경로를 바꿔서 다시 찾아보세요.</p></div>`;
      return `<div class="overview-grid">${list.map(screen => `<article class="screen-card" data-open="${screen.id}"><div class="screen-card-preview ${screen.platform}"><div class="device-screen ${screen.platform}">${screenMarkup(screen)}</div></div><div class="card-copy"><div><h2>${screen.title}</h2><p>${screen.summary}</p></div><span class="route-pill">${screen.route}</span></div></article>`).join('')}</div>`;
    }

    function updateScale() {
      const stage = document.querySelector('.prototype-stage');
      const wrap = document.querySelector('.device-wrap');
      const device = document.querySelector('.prototype-stage .device-screen');
      if (!stage || !wrap || !device) return;
      const screen = currentScreen();
      const width = screen.platform === 'web' ? 1180 : 390;
      const height = screen.platform === 'web' ? 720 : 844;
      const availableWidth = Math.max(260, stage.clientWidth - 84);
      const availableHeight = Math.max(520, window.innerHeight - 240);
      const scale = state.fit ? Math.min(1, availableWidth / width, availableHeight / height) : 1;
      document.documentElement.style.setProperty('--preview-scale', scale.toFixed(4));
      wrap.style.width = `${Math.round(width * scale)}px`;
      wrap.style.height = `${Math.round(height * scale)}px`;
    }

    function renderPrototype() {
      const screen = currentScreen();
      requestAnimationFrame(updateScale);
      return `<div class="prototype-stage"><div class="device-wrap"><div class="device-screen ${screen.platform}">${screenMarkup(screen)}</div></div></div>`;
    }

        { platform: 'web', title: 'Web Room flow', ids: ['web-room-join','web-room','web-create','web-plan'] },

        { platform: 'mobile', title: 'Mobile invite & Room flow', ids: ['mobile-invite','mobile-plan','mobile-room-join','mobile-room','mobile-create'] }

    function render() {

      } else {
        eyebrow.textContent = 'FOUNDATIONS'; heading.textContent = '디자인 기준'; description.textContent = '웹 CSS와 Flutter 테마에 공통으로 사용되는 Aimasho의 색상, 타입과 핵심 UI 요소입니다.'; controls.hidden = true; workspace.innerHTML = renderTokens();
      }
      renderInspector();
    }

    function openScreen(id) {
      if (!screens.some(screen => screen.id === id)) return;
      state.currentId = id;
      state.view = 'prototype';
      render();
    }

    function moveScreen(offset) {
      const screen = currentScreen();
      const order = screens.filter(item => item.platform === screen.platform);
      const index = order.findIndex(item => item.id === screen.id);
      openScreen(order[(index + offset + order.length) % order.length].id);
    }

    document.addEventListener('click', event => {
      const view = event.target.closest('[data-view]');
      const platform = event.target.closest('[data-platform]');
      const open = event.target.closest('[data-open]');
      const go = event.target.closest('[data-go]');
      if (view) { state.view = view.dataset.view; render(); return; }
      if (platform) { state.platform = platform.dataset.platform; render(); return; }
      if (open) { openScreen(open.dataset.open); return; }
      if (go) { openScreen(go.dataset.go); }
    });

    document.querySelector('#screenSearch').addEventListener('input', event => { state.query = event.target.value; if (state.view !== 'overview') state.view = 'overview'; render(); });
    document.querySelector('#previousScreen').addEventListener('click', () => moveScreen(-1));
    document.querySelector('#nextScreen').addEventListener('click', () => moveScreen(1));
    document.querySelector('#fitScreen').addEventListener('click', event => { state.fit = !state.fit; event.currentTarget.textContent = state.fit ? '화면 맞춤' : '100% 보기'; updateScale(); });
    document.addEventListener('keydown', event => {
      if (event.target.matches('input')) return;
      if (event.key === 'ArrowLeft' && state.view === 'prototype') moveScreen(-1);
      if (event.key === 'ArrowRight' && state.view === 'prototype') moveScreen(1);
      if (event.key.toLowerCase() === 'f' && state.view === 'prototype') { state.fit = !state.fit; updateScale(); }
      if (event.key === 'Escape') { state.view = 'overview'; render(); }
    });
    window.addEventListener('resize', updateScale);

    render();
  </script>
</body>
</html>
